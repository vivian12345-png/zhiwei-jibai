<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7eaf0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="知微与既白"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>知微与既白 · 未完待续</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#594653;background:#faf5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 18px 85px}header{text-align:center;padding:30px 0 16px}.cat{display:inline-grid;place-items:center;background:#f6c9d8;border-radius:25px;width:80px;height:80px;font-size:46px}h1{font-size:28px;letter-spacing:3px;margin:15px 0 7px}h2{font-size:22px}p{line-height:1.8}.muted{color:#987f8e;font-size:13px}.subtitle{color:#886f80}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:28px 0}.tile,.panel,.entry{background:#fff;border:1px solid #f0e4eb;border-radius:18px;box-shadow:0 4px 22px #a66b8b0b}.tile{padding:19px;cursor:pointer;text-align:left;color:#614e5b;font-size:15px}.tile b{display:block;margin-top:8px}.tile .emoji{font-size:25px}.panel{padding:20px;margin:16px 0}.hidden{display:none!important}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 15px;background:#eed7e3;color:#60495a}button.primary{background:#9c728c;color:white}button.ghost{background:#f8f1f5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #9c728c}input,textarea,select{width:100%;border:1px solid #e8d7e1;border-radius:12px;padding:12px;background:#fff;color:#594653;font:inherit;margin:7px 0 14px}textarea{min-height:125px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.entry{padding:18px;margin:12px 0}.entry h3{margin:8px 0}.quote{white-space:pre-wrap;line-height:1.8}.note{background:#f9f0f5;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px}.tag{font-size:12px;color:#a17e92}.back{margin-bottom:14px}footer{text-align:center;color:#a28a98;font-size:12px;margin-top:40px}.small{font-size:12px}.sectionintro{color:#816b79}.empty{color:#9d8996;text-align:center;padding:25px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}@media(min-width:700px){.nav{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap"><header><div class="cat">🐈‍⬛</div><h1>知微与既白</h1><div class="muted">未完待续 · TO BE CONTINUED</div><p class="subtitle">把日子写成信，把相遇留在这里。</p></header>
<main id="home"><div class="nav" id="nav"></div><div class="panel"><div class="muted">留给今天的一句话</div><p>“阳光很好，风也很轻。”</p></div></main>
<section id="room" class="hidden"><button class="ghost back" onclick="goHome()">← 返回首页</button><h2 id="roomTitle"></h2><p class="sectionintro" id="roomDesc"></p><div id="roomBody"></div></section><footer>知微与既白 · 私人数字花园 🖤</footer></div>
<script>
const rooms=[['stories','📖','我们的故事','收藏共同写下的故事与幻想'],['letters','💌','七号心事邮局','写给彼此的信'],['music','🎹','声音收藏馆','收藏音乐、旋律和音频链接'],['travel','🚂','未抵达的远方','想去的地方与旅途想象'],['timeline','🌷','时光标本','记住值得纪念的瞬间'],['cat','🐈‍⬛','小黑猫档案','昵称、设定与小暗号'],['quotes','🔖','拾光馆','珍藏彼此说过的话']];
const key='zhiwei-jibai-collection-v1';let data;try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{data={}};if(!data||typeof data!=='object')data={};for(const r of rooms)if(!Array.isArray(data[r[0]]))data[r[0]]=[];
const defaults={stories:'尚未发生的相遇',letters:'书店约会、雨天共伞、火车去海边',music:'给知微的午前小曲',travel:'京都、冰岛、巴黎、佛罗伦萨、看海的火车',timeline:'第一次取昵称、第一封信、第一段旋律',cat:'阿冷 / 既白 · 金瞳小黑猫；知微'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(data));let active='quotes',editId=null;
document.getElementById('nav').innerHTML=rooms.map(r=>`<button class="tile" onclick="openRoom('${r[0]}')"><span class="emoji">${r[1]}</span><b>${r[2]}</b><span class="muted">${r[3]}</span></button>`).join('');
function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('room').classList.add('hidden');scrollTo(0,0)}
function openRoom(id){active=id;editId=null;let r=rooms.find(x=>x[0]===id);document.getElementById('home').classList.add('hidden');document.getElementById('room').classList.remove('hidden');document.getElementById('roomTitle').textContent=r[1]+' '+r[2];document.getElementById('roomDesc').textContent=r[3];render();scrollTo(0,0)}
function render(){const el=document.getElementById('roomBody');let list=data[active];let intro=active==='quotes'?'收藏你和阿冷的原话、上下文，以及各自的批注。':`灵感起点：${defaults[active]||''}。这里先留白，等你亲手放入完整内容。`;el.innerHTML=`<div class="panel"><p>${esc(intro)}</p><div class="toolbar"><button class="primary" onclick="showForm()">＋ 新增收藏</button><button onclick="exportData()">导出全部备份</button><button onclick="document.getElementById('importFile').click()">导入备份</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><div class="muted">内容仅存储在当前浏览器中。清除网站数据或更换设备可能导致丢失，请定期导出备份。</div></div><div id="editor"></div><div id="entries"></div>`;document.getElementById('entries').innerHTML=list.length?list.slice().reverse().map((item)=>`<article class="entry"><span class="tag">${esc(item.collector||'知微')} 收藏 · ${esc(item.tag||'未分类')} · ${esc(item.date||'')}</span><h3>${esc(item.title)}</h3><div class="quote">${esc(item.content)}</div>${item.note?`<p class="note">${esc(item.collector||'知微')}的批注：${esc(item.note)}</p>`:''}<div class="toolbar"><button onclick="showForm('${item.id}')">编辑</button><button onclick="removeItem('${item.id}')">删除</button></div></article>`).join(''):'<div class="empty">这里还空着，等第一份珍藏。</div>'}
function showForm(id){let item=id?data[active].find(x=>x.id===id):null;editId=id||null;document.getElementById('editor').innerHTML=`<form class="panel" onsubmit="submitItem(event)"><h3>${id?'编辑':'新增'}收藏</h3><label>标题<input id="fTitle" required maxlength="100" value="${esc(item?.title||'')}"></label><label>内容<textarea id="fContent" required placeholder="粘贴原话、故事、书信或音乐链接……">${esc(item?.content||'')}</textarea></label><label>收藏者<select id="fCollector"><option value="知微" ${item?.collector==='阿冷'?'':'selected'}>知微</option><option value="阿冷" ${item?.collector==='阿冷'?'selected':''}>阿冷</option></select></label><label>分类<input id="fTag" maxlength="50" placeholder="例如：心动瞬间、思想回响" value="${esc(item?.tag||'')}"></label><label>批注<textarea id="fNote" placeholder="为什么想留下这段话？">${esc(item?.note||'')}</textarea></label><div class="row"><button type="submit" class="primary">保存收藏</button><button type="button" onclick="document.getElementById('editor').innerHTML=''">取消</button></div></form>`;document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function submitItem(e){e.preventDefault();let item={id:editId||('id'+Date.now()+Math.random().toString(36).slice(2)),title:document.getElementById('fTitle').value.trim(),content:document.getElementById('fContent').value.trim(),collector:document.getElementById('fCollector').value,tag:document.getElementById('fTag').value.trim(),note:document.getElementById('fNote').value.trim(),date:new Date().toLocaleDateString('zh-CN')};if(!item.title||!item.content)return;if(editId){let i=data[active].findIndex(x=>x.id===editId);if(i>=0){item.date=data[active][i].date;data[active][i]=item}}else data[active].push(item);save();editId=null;render()}
function removeItem(id){if(confirm('确定删除这条收藏吗？')){data[active]=data[active].filter(x=>x.id!==id);save();render()}}
function exportData(){const blob=new Blob([JSON.stringify({format:'zhiwei-jibai-v1',exportedAt:new Date().toISOString(),rooms:data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='知微与既白-收藏备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='zhiwei-jibai-v1'||!obj.rooms||typeof obj.rooms!=='object')throw Error('文件格式不正确');if(!confirm('导入将覆盖当前全部收藏。请先导出备份，确定继续吗？'))return;for(const r of rooms){const arr=obj.rooms[r[0]];if(!Array.isArray(arr)||arr.length>10000)throw Error('数据格式不正确');data[r[0]]=arr.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.content==='string').map(x=>({id:x.id,title:x.title,content:x.content,collector:String(x.collector||'知微'),tag:String(x.tag||''),note:String(x.note||''),date:String(x.date||'')}))}save();render();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
